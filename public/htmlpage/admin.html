<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Glow Ritual - Admin Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 font-sans antialiased">

    <nav class="bg-[#0f2c3d] text-white p-4 shadow-md">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-bold tracking-wider">LOGO And Name <span class="text-xs text-green-400 ml-2">ADMIN</span></h1>
            <a href="index.html" class="text-sm bg-gray-700 hover:bg-gray-600 px-4 py-2 rounded transition">View Store</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto my-10 p-6 bg-white rounded-lg shadow-sm border border-gray-100">
        
        <div class="border-b border-gray-200 pb-4 mb-6">
            <h2 class="text-2xl font-semibold text-gray-800">Add New Product</h2>
            <p class="text-sm text-gray-500 mt-1">Fill in the details below to add a new item to the e-commerce store.</p>
        </div>

        <form class="space-y-6">
            
            <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
                <div class="md:col-span-2">
                    <label class="block text-sm font-medium text-gray-700 mb-2">Product Name *</label>
                    <input type="text" placeholder="e.g., Daily Radiance Face Cream" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#0f2c3d] focus:outline-none text-gray-800">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Price (₹) *</label>
                    <input type="number" placeholder="300" min="0" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#0f2c3d] focus:outline-none text-gray-800">
                </div>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Collection / Category *</label>
                    <select class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#0f2c3d] focus:outline-none text-gray-800">
                        <option value="skincare">Skincare</option>
                        <option value="haircare">Haircare</option>
                        <option value="bodycare">Bodycare</option>
                    </select>
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Stock Quantity *</label>
                    <input type="number" placeholder="e.g., 50" min="0" required
                           class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#0f2c3d] focus:outline-none text-gray-800">
                </div>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Description *</label>
                <textarea rows="4" placeholder="Write a detailed description about the product ingredients, benefits, and how to use..." required
                          class="w-full px-4 py-2 border border-gray-300 rounded-md focus:ring-2 focus:ring-[#0f2c3d] focus:outline-none text-gray-800"></textarea>
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-2">Product Images *</label>
                <div class="mt-1 flex justify-center px-6 pt-5 pb-6 border-2 border-gray-300 border-dashed rounded-md hover:border-[#0f2c3d] transition-colors bg-gray-50 cursor-pointer">
                    <div class="space-y-1 text-center">
                        <svg class="mx-auto h-12 w-12 text-gray-400" stroke="currentColor" fill="none" viewBox="0 0 48 48" aria-hidden="true">
                            <path d="M28 8H12a4 4 0 00-4 4v20a4 4 0 004 4h20a4 4 0 004-4V20m-10-4l-6 6m0 0l-6-6m6 6v14" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
                        </svg>
                        <div class="flex text-sm text-gray-600 justify-center">
                            <label class="relative font-medium text-[#0f2c3d] hover:underline">
                                <span>Upload a file</span>
                                <input type="file" accept="image/*" class="sr-only">
                            </label>
                            <p class="pl-1">or drag and drop</p>
                        </div>
                        <p class="text-xs text-gray-500">PNG, JPG, WEBP up to 5MB</p>
                    </div>
                </div>
            </div>

            <div class="flex justify-end space-x-4 border-t border-gray-200 pt-6">
                <button type="button" class="px-6 py-2 border border-gray-300 rounded-md text-sm font-medium text-gray-700 hover:bg-gray-50 transition">
                    Discard
                </button>
                <button type="submit" class="px-6 py-2 bg-[#0f2c3d] text-white rounded-md text-sm font-medium hover:bg-[#163e55] transition shadow-sm">
                    Publish Product
                </button>
            </div>

        </form>
    </main>

</body>
</html>
