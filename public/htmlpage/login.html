<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Register</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        body{
            font-family: 'Poppins', sans-serif;
        }
    </style>
</head>

<body class="bg-gradient-to-br from-indigo-700 via-purple-700 to-pink-600 min-h-screen flex items-center justify-center p-5">

<div class="w-full max-w-5xl rounded-3xl overflow-hidden shadow-2xl bg-white/10 backdrop-blur-xl border border-white/20 grid md:grid-cols-2">

    <!-- Left Side -->
    <div class="hidden md:flex flex-col justify-center items-center p-10 text-white">

        <h1 class="text-5xl font-bold mb-5">
            Welcome!
        </h1>

        <p class="text-center text-lg opacity-90">
            Login or create an account to continue your journey with us.
        </p>

        <img
        src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?w=700"
        class="rounded-2xl mt-10 shadow-xl"
        alt="">
    </div>

    <!-- Right Side -->
    <div class="bg-white p-10">

        <!-- Tabs -->
        <div class="flex bg-gray-100 rounded-full p-1 mb-8">

            <button id="loginBtn"
            class="w-1/2 py-3 rounded-full bg-indigo-600 text-white font-semibold transition">
                Login
            </button>

            <button id="registerBtn"
            class="w-1/2 py-3 rounded-full font-semibold text-gray-700 transition">
                Register
            </button>

        </div>

        <!-- Login Form -->
        <form id="loginForm">

            <h2 class="text-3xl font-bold mb-6">
                Sign In
            </h2>

            <div class="space-y-5">

                <input
                type="email"
                placeholder="Email Address"
                class="w-full px-5 py-4 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-indigo-500">

                <input
                type="password"
                placeholder="Password"
                class="w-full px-5 py-4 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-indigo-500">

                <div class="flex justify-between text-sm">

                    <label class="flex items-center gap-2">
                        <input type="checkbox">
                        Remember Me
                    </label>

                    <a href="#" class="text-indigo-600">
                        Forgot Password?
                    </a>

                </div>

                <button
                class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-4 rounded-xl font-semibold transition">
                    Login
                </button>

            </div>

        </form>

        <!-- Register Form -->
        <form id="registerForm" class="hidden">

            <h2 class="text-3xl font-bold mb-6">
                Create Account
            </h2>

            <div class="space-y-5">

                <input
                type="text"
                placeholder="Full Name"
                class="w-full px-5 py-4 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-pink-500">

                <input
                type="email"
                placeholder="Email Address"
                class="w-full px-5 py-4 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-pink-500">

                <input
                type="password"
                placeholder="Password"
                class="w-full px-5 py-4 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-pink-500">

                <input
                type="password"
                placeholder="Confirm Password"
                class="w-full px-5 py-4 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-pink-500">
               
                <input
                type="address"
                placeholder="address"
                class="w-full px-5 py-4 rounded-xl border border-gray-300 outline-none focus:ring-2 focus:ring-pink-500">

                <button
                class="w-full bg-pink-600 hover:bg-pink-700 text-white py-4 rounded-xl font-semibold transition">
                    Register
                </button>

            </div>

        </form>

    </div>

</div>

<script>

const loginBtn=document.getElementById("loginBtn");
const registerBtn=document.getElementById("registerBtn");

const loginForm=document.getElementById("loginForm");
const registerForm=document.getElementById("registerForm");

loginBtn.onclick=()=>{

loginForm.classList.remove("hidden");
registerForm.classList.add("hidden");

loginBtn.classList.add("bg-indigo-600","text-white");

registerBtn.classList.remove("bg-indigo-600","text-white");

}

registerBtn.onclick=()=>{

registerForm.classList.remove("hidden");
loginForm.classList.add("hidden");

registerBtn.classList.add("bg-indigo-600","text-white");

loginBtn.classList.remove("bg-indigo-600","text-white");

}

</script>

</body>
</html>
